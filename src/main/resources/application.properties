spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Server Port
server.port=${PORT:8081}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgvs_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Jackson Configuration (para evitar erros com lazy loading em DTOs)
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT Security
application.security.jwt.secret-key=${JWT_SECRET_KEY:AR^CTX^*v?jo]8Aw!8}Q,V(sRGr<[o6-G@-7-8NNYYH}
application.security.jwt.expiration=86400000

# Google OAuth Configuration
application.security.google.client-id=${GOOGLE_CLIENT_ID_SERVER:100517451932-6ig5ef7nssk34smisede47ogo9vsihuh.apps.googleusercontent.com}
application.security.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
application.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}

# API Banco Central do Brasil
api.bcb.base-url=https://api.bcb.gov.br/dados/serie/bcdata.sgs

# API IBGE (opcional)
api.ibge.base-url=https://servicodados.ibge.gov.br/api/v3

# Configuração do Job
inflation.update.enabled=true
inflation.default-index=IPCA
inflation.fallback-rate=0.35  # 0.35% ao mês como fallback
